name: CourseTrack migration plan

on:
  pull_request_target:
    branches: [staging, main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: migration-plan-${{ github.event.pull_request.base.ref }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: ${{ github.event.pull_request.base.ref == 'main' && 'Production migration plan' || 'Staging migration plan' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event.pull_request.base.ref == 'main' && 'Production' || 'staging' }}
    steps:
      - name: Check out protected base workflow and scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Check out candidate migrations as inert data
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: _candidate
          persist-credentials: false
          sparse-checkout: |
            supabase/migrations
          sparse-checkout-cone-mode: false
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install protected base dependencies
        run: npm ci --ignore-scripts
      - name: Validate candidate manifest and report pending migrations
        env:
          COURSETRACK_SCHEMA_DATABASE_URL: ${{ secrets.COURSETRACK_SCHEMA_DATABASE_URL }}
          COURSETRACK_STAGING_SUPABASE_REF: ${{ vars.COURSETRACK_STAGING_SUPABASE_REF }}
          COURSETRACK_PRODUCTION_SUPABASE_REF: ${{ vars.COURSETRACK_PRODUCTION_SUPABASE_REF }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: >-
          node scripts/plan-migrations.mjs
          --target=${{ github.event.pull_request.base.ref == 'main' && 'production' || 'staging' }}
          --base-dir=.
          --candidate-dir=_candidate
