name: CourseTrack staging release

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      sha:
        description: Exact staging commit to release (defaults to the current staging head)
        required: false
        type: string

concurrency:
  group: release-staging
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  release:
    name: Staging release verified
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    env:
      RELEASE_SHA: ${{ inputs.sha || github.sha }}
      COURSETRACK_ENVIRONMENT: staging
      VERCEL_GIT_COMMIT_REF: staging
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      COURSETRACK_SCHEMA_DATABASE_URL: ${{ secrets.COURSETRACK_SCHEMA_DATABASE_URL }}
      COURSETRACK_MIGRATION_DATABASE_URL: ${{ secrets.COURSETRACK_MIGRATION_DATABASE_URL || secrets.STAGING_DATABASE_URL }}
      COURSETRACK_STAGING_SUPABASE_REF: ${{ vars.COURSETRACK_STAGING_SUPABASE_REF }}
      COURSETRACK_PRODUCTION_SUPABASE_REF: ${{ vars.COURSETRACK_PRODUCTION_SUPABASE_REF }}
      COURSETRACK_SMOKE_BASE_URL: ${{ vars.COURSETRACK_SMOKE_BASE_URL }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require an exact staging SHA
        run: |
          test -n "$RELEASE_SHA"
          test "${{ github.event_name }}" = "workflow_dispatch" || test "${{ github.ref }}" = "refs/heads/staging"
      - name: Check out the exact validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0
      - name: Verify SHA is the current staging head
        run: |
          git fetch origin staging
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/staging)"
      - name: Wait for successful CI on the exact SHA
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            result="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${RELEASE_SHA}&event=push&per_page=1" --jq '[.workflow_runs[0].status // "", .workflow_runs[0].conclusion // ""] | @tsv')"
            IFS=$'\t' read -r status conclusion <<< "$result"
            if test "$status" = "completed"; then
              test "$conclusion" = "success"
              exit
            fi
            sleep 10
          done
          echo "Timed out waiting for CourseTrack CI on ${RELEASE_SHA}." >&2
          exit 1
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply pending staging migrations
        run: npx --yes supabase@2.110.0 migration up --db-url "$COURSETRACK_MIGRATION_DATABASE_URL"
      - name: Verify staging contract
        run: npm run check:deployment
      - name: Audit staging data
        run: npm run audit:course-data -- --target=staging --require-full-parity
      - name: Resolve exact Vercel Git deployment
        id: vercel
        shell: bash
        run: |
          for attempt in $(seq 1 90); do
            deployments="$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${RELEASE_SHA}&environment=Preview&per_page=50")"
            deployment_id="$(jq -r '[.[] | select(.creator.login == "vercel[bot]")][0].id // empty' <<< "$deployments")"
            if test -n "$deployment_id"; then
              statuses="$(gh api "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses?per_page=20")"
              state="$(jq -r '.[0].state // empty' <<< "$statuses")"
              if test "$state" = "success"; then
                url="$(jq -r '.[0].environment_url // .[0].target_url // empty' <<< "$statuses")"
                test -n "$url"
                echo "::add-mask::$url"
                echo "url=$url" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              case "$state" in
                error|failure|inactive)
                  echo "Vercel Git deployment ${deployment_id} finished with ${state}." >&2
                  exit 1
                  ;;
              esac
            fi
            sleep 10
          done
          echo "Timed out waiting for Vercel Git deployment of ${RELEASE_SHA}." >&2
          exit 1
      - name: Smoke unique staging deployment
        env:
          COURSETRACK_SMOKE_BASE_URL: ${{ steps.vercel.outputs.url }}
          COURSETRACK_SMOKE_EXPECTED_COMMIT: ${{ env.RELEASE_SHA }}
        run: npm run smoke:deployment:health
      - name: Smoke stable staging URL
        env:
          COURSETRACK_SMOKE_EXPECTED_COMMIT: ${{ env.RELEASE_SHA }}
        run: npm run smoke:deployment:health
