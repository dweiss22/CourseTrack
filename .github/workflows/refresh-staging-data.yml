name: Refresh staging data

on:
  schedule:
    - cron: "0 8 * * 0"
  workflow_dispatch:

concurrency:
  group: refresh-staging-data
  cancel-in-progress: false

jobs:
  refresh:
    # STAGING_REFRESH_ENABLED must be a REPOSITORY variable, not an environment
    # one. A job-level `if` is evaluated before the job is assigned its
    # environment, so environment-scoped variables read as an empty string here
    # and the job silently skips -- and a skipped job reports the workflow run
    # as successful, so it fails invisibly. This bug was live in this file: the
    # variable was set on the `staging` environment on 2026-08-06, and the
    # scheduled run on 2026-08-09 was skipped, so the weekly snapshot never ran.
    # Note the contrast with STAGING_TESTER_EMAILS below, which stays
    # environment-scoped because it is only read at step level, after the
    # environment has been resolved.
    if: github.event_name == 'workflow_dispatch' || vars.STAGING_REFRESH_ENABLED == 'true'
    name: Sanitized production snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: staging

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh staging from production
        env:
          COURSETRACK_ENVIRONMENT: staging
          PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          STAGING_MASKING_KEY: ${{ secrets.STAGING_MASKING_KEY }}
          STAGING_TESTER_EMAILS: ${{ vars.STAGING_TESTER_EMAILS }}
        run: node scripts/refresh-staging-from-production.mjs
